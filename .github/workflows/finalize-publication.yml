name: Finalize publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-publication.yml']
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Make documentation portable between the repository and extracted archives
        shell: python
        run: |
          import json, re, subprocess, posixpath
          from pathlib import Path
          root=Path.cwd(); cfg=json.loads(Path('release.json').read_text()); cfg['Revision']=3; cfg['Tag']='v'+cfg['Version']+'-r3'
          Path('release.json').write_text(json.dumps(cfg,indent=2)+'\n')
          base=cfg['Repositories'][cfg['Component']]+'/blob/main/'
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          for name in tracked:
              p=Path(name)
              if p.suffix.lower() not in {'.md','.txt'} or not p.is_file(): continue
              text=p.read_text(encoding='utf-8').replace('R2','R3')
              if p.name.lower().startswith('license'): continue
              def replace(m):
                  url=m.group(2)
                  if re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*:',url) or url.startswith('#'): return m.group(0)
                  target=posixpath.normpath(posixpath.join(p.parent.as_posix(),url.split('#')[0]))
                  if not (root/target).exists(): raise ValueError('Broken repository link: '+name+' -> '+url)
                  return m.group(1)+base+target+('#'+url.split('#',1)[1] if '#' in url else '')+')'
              text=re.sub(r'(\[[^\]]+\]\()([^\s)]+)\)',replace,text)
              p.write_text(text,encoding='utf-8')
          wf=Path('.github/workflows/release.yml')
          text=wf.read_text(); marker='      - name: Publish new revision without replacing existing assets\n'
          addition='      - name: Capture publication source\n        shell: pwsh\n        run: |\n          New-Item -ItemType Directory -Force -Path publication-source | Out-Null\n          git archive --format=zip -o publication-source/source.zip HEAD\n      - uses: actions/upload-artifact@v6\n        with:\n          name: publication-source\n          path: publication-source/\n          retention-days: 3\n'
          if marker not in text: raise ValueError('Publication step missing')
          wf.write_text(text.replace(marker,addition+marker))
          Path('.github/workflows/finalize-publication.yml').unlink()
      - name: Commit final metadata and publish
        run: |
          git config user.name arribbaa
          git config user.email 315126767+LocoPablito@users.noreply.github.com
          git add -A
          git commit -m "Finalize portable release documentation"
          git push origin HEAD:main
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
