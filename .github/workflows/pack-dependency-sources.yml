name: Collect pinned pack dependency sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pack-dependency-sources.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve package-matched source revisions
        shell: python
        run: |
          import urllib.request,pathlib,hashlib,json,concurrent.futures
          out=pathlib.Path('dependency-sources');out.mkdir()
          refs={
            'Capstone.NET':('ds5678/Capstone.NET','b90e380c14e857865c94a355954236e678bd557c'),
            'AsmResolver':('Washi1337/AsmResolver','124e161a9bc0ebb83b4d97276ae3da3c9cfe2fc5'),
            'MonoMod.Backports':('MonoMod/MonoMod','a1b82852b2574742776af08818487b90b0bfab93'),
            'Cpp2IL':('SamboyCoding/Cpp2IL','558ddd98642010897d54316b51fbaa7889fda093'),
            'AssetRipper.CIL':('AssetRipper/AssetRipper.CIL','06216e69825ccd6536dc17e9ca81c4d539ce9321'),
            'AssetRipper.Primitives':('AssetRipper/AssetRipper.Primitives','d759b3db98bf2a1cb8c2181faf5d405610aac585'),
            'SemanticVersioning':('adamreeve/semver.net','c52c9d4c5d34a6a3bb6ff45f7276d8b6e951a42d'),
            'Mono.Cecil':('jbevain/cecil','0.11.4'),
            'Disarm':('SamboyCoding/Disarm','8574010015c8c56bb7faad7e407c50b0abe9cc72'),
            'MonoMod.Legacy':('MonoMod/MonoMod','v22.07.31.01'),
            'HarmonyX':('BepInEx/HarmonyX','v2.10.2'),
            'Iced':('icedland/iced','601c40570d6c986c8e1a6a2e483dd2fdf5ade552')
          }
          def get(pair):
            name,(repo,ref)=pair;url=f'https://api.github.com/repos/{repo}/zipball/{ref}'
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MimicParty-license-packaging'}),timeout=120) as r:data=r.read()
            (out/(name+'.zip')).write_bytes(data)
            return name,{'Repository':repo,'Revision':ref,'URL':url,'SHA256':hashlib.sha256(data).hexdigest()}
          rec=dict(concurrent.futures.ThreadPoolExecutor(max_workers=3).map(get,refs.items()))
          (out/'SOURCE_ORIGINS.json').write_text(json.dumps(rec,indent=2))
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pack-dependency-sources
          path: dependency-sources/
          retention-days: 7
