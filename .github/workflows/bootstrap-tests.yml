name: Validate interop bootstrap
on:
  push:
    branches: [release/1.0.0, main]
  pull_request:
    paths: ['src/MimicParty.InteropBootstrap/**', 'tests/InteropBootstrap.Tests/**', '.github/workflows/bootstrap-tests.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - name: Build bootstrap and test harness
        shell: pwsh
        run: |
          dotnet build src/MimicParty.InteropBootstrap -c Release
          if ($LASTEXITCODE) { throw 'Bootstrap build failed' }
          dotnet build tests/InteropBootstrap.Tests -c Release -f net8.0
          if ($LASTEXITCODE) { throw 'Test build failed' }
          New-Item out -ItemType Directory -Force | Out-Null
          dotnet tests/InteropBootstrap.Tests/bin/Release/net8.0/InteropBootstrap.Tests.dll | Tee-Object out/windows-tests.txt
          if ($LASTEXITCODE) { throw 'Tests failed' }
      - name: Publish isolated managed probe and review material
        shell: pwsh
        run: |
          dotnet publish tests/InteropBootstrap.Tests -c Release -f net6.0 -r linux-x64 --self-contained true -p:RuntimeFrameworkVersion=6.0.7 -o out/probe
          if ($LASTEXITCODE) { throw 'Probe build failed' }
          Copy-Item src/MimicParty.InteropBootstrap/bin/Release/net6.0/MimicParty.InteropBootstrap.dll out/
          git archive --format=zip -o out/Core-source-review.zip HEAD
          git bundle create out/Core-before-release.bundle origin/main
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: interop-bootstrap-validation
          path: out/
          retention-days: 7
