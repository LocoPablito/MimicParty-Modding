name: Collect BepInEx pack source and license material
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pack-sources.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve exact upstream source revisions and notices
        shell: python
        run: |
          import urllib.request, pathlib, hashlib, json, concurrent.futures
          out=pathlib.Path('source-material');out.mkdir()
          items={
            'Il2CppInterop_1.5.3.zip':'https://api.github.com/repos/BepInEx/Il2CppInterop/zipball/v1.5.3',
            'UnityDoorstop_4.5.0.zip':'https://api.github.com/repos/NeighTools/UnityDoorstop/zipball/v4.5.0',
            'Dobby_1.0.5.zip':'https://api.github.com/repos/BepInEx/Dobby/zipball/v1.0.5',
            'dotnet-runtime-build_6.0.7.zip':'https://api.github.com/repos/BepInEx/dotnet-runtime/zipball/6.0.7',
            'DOTNET_LICENSE.TXT':'https://raw.githubusercontent.com/dotnet/runtime/0ec02c8c96e2eda06dc5b5edfdbdba0f36415082/LICENSE.TXT',
            'DOTNET_THIRD-PARTY-NOTICES.TXT':'https://raw.githubusercontent.com/dotnet/runtime/0ec02c8c96e2eda06dc5b5edfdbdba0f36415082/THIRD-PARTY-NOTICES.TXT'
          }
          def get(pair):
            name,url=pair
            req=urllib.request.Request(url,headers={'User-Agent':'MimicParty-source-packaging'})
            with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
            (out/name).write_bytes(data)
            return name,{'URL':url,'SHA256':hashlib.sha256(data).hexdigest(),'Bytes':len(data)}
          records=dict(concurrent.futures.ThreadPoolExecutor(max_workers=3).map(get,items.items()))
          (out/'SOURCE_ORIGINS.json').write_text(json.dumps(records,indent=2))
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pinned-pack-source-material
          path: source-material/
          retention-days: 7
