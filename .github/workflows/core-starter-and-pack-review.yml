name: Validate developer starter and pack licensing inputs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/core-starter-and-pack-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - name: Retrieve pinned source and runtime inputs
        shell: pwsh
        run: |
          gh run download 34633327708 -n pinned-bepinex-pack-inputs -D _pack_inputs
          if ($LASTEXITCODE) { throw 'Input download failed' }
          Expand-Archive _pack_inputs/BepInEx_788_source.zip -DestinationPath _upstream
          gh release download v1.0.0 --repo LocoPablito/MimicParty-Modding -p MimicParty_Modding_Core_v1.0.0.zip -D _core_package
          Expand-Archive _core_package/MimicParty_Modding_Core_v1.0.0.zip -DestinationPath _installed
      - name: Compile starter against exact released Core
        shell: pwsh
        run: |
          New-Item review -ItemType Directory -Force | Out-Null
          $core=(Resolve-Path _installed/BepInEx/plugins/MimicPartyModdingCore.dll).Path
          dotnet build examples/StarterMod -c Release "-p:CoreReference=$core" | Tee-Object review/starter-build.txt
          if ($LASTEXITCODE) { throw 'Starter build failed' }
          if (Test-Path examples/StarterMod/bin/Release/net6.0/MimicPartyModdingCore.dll) { throw 'Core must not be copied into starter output' }
          'PASS: starter compiles against released Core; dependency DLL is not copied.' | Add-Content review/starter-build.txt
      - name: Restore pinned upstream dependency graph for license inspection
        shell: pwsh
        run: |
          $proj=(Get-ChildItem _upstream -Recurse -Filter BepInEx.Unity.IL2CPP.csproj | Select-Object -First 1).FullName
          dotnet restore $proj --source https://api.nuget.org/v3/index.json --source https://nuget.bepinex.dev/v3/index.json --source https://nuget.samboy.dev/v3/index.json
          if ($LASTEXITCODE) { throw 'Pinned dependency restore failed' }
          $assets=Join-Path (Split-Path $proj) obj/project.assets.json
          Copy-Item $assets review/upstream-project.assets.json
          python -c "import os,pathlib,json,shutil; p=pathlib.Path('review/upstream-project.assets.json');j=json.loads(p.read_text(encoding='utf-8-sig'));root=pathlib.Path(next(iter(j['packageFolders'])));out=pathlib.Path('review/nuget');out.mkdir(exist_ok=True);[(shutil.copyfile(f,out/(f.parent.parent.name+'__'+f.parent.name+'__'+f.name))) for v in j['libraries'].values() if v.get('type')=='package' for f in (root/v['path']).glob('*.nupkg')]"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-starter-and-pack-review
          path: review/
          retention-days: 7
