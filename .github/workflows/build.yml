name: Build Core and compatibility bootstrap
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - shell: pwsh
        run: |
          dotnet build src/MimicParty.ModdingCore -c Release
          if ($LASTEXITCODE) { throw 'Core build failed' }
          dotnet build src/MimicParty.InteropBootstrap -c Release
          if ($LASTEXITCODE) { throw 'Bootstrap build failed' }
          dotnet run --project tests/InteropBootstrap.Tests -c Release -f net8.0
          if ($LASTEXITCODE) { throw 'Regression tests failed' }
