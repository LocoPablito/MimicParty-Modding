name: One-time authorized release cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-release-cleanup.yml']
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove only backed-up, unchanged development references
        shell: python
        run: |
          import json, subprocess, os, urllib.parse
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path, method='GET'):
              args=['gh','api', '-X', method, 'repos/'+repo+'/'+path]
              p=subprocess.run(args,text=True,capture_output=True)
              if p.returncode: raise RuntimeError(p.stderr)
              return json.loads(p.stdout) if p.stdout.strip() else None
          assert not api('releases/tags/v1.0.0')['draft']
          targets={
              'release/1.0.0':'c6984654398c69f4161cfe7b7fb36c1af09f7091',
              'release-audit-final':'99578b9cb7f8a27774c0fcde16a3a5dcbd2f70cf',
              'release-hardening':'f75281d1a2fec2059409752092dc4dfda9649aa5',
              'release-hygiene':'ab4d95c21f240953f4d8a10aade1820a5235ad2b',
              'runtime-v1.1':'4a2a16067cb2c89a147f4cb67857c5ba1416485d'}
          present={b['name']:b for b in api('branches?per_page=100')}
          for name,sha in targets.items():
              if name not in present: continue
              assert present[name]['commit']['sha']==sha and not present[name]['protected'], 'Changed/protected branch; refusing cleanup'
              api('git/refs/heads/'+urllib.parse.quote(name,safe=''),'DELETE')
              print('Removed archived branch:',name)
          for artifact in api('actions/artifacts?per_page=100')['artifacts']:
              if artifact['name']=='Core-author-development-archive':
                  api('actions/artifacts/'+str(artifact['id']),'DELETE')
                  print('Removed downloaded author archive artifact:',artifact['id'])
          print('Current release assets, validation artifacts, main and Git history retained.')
